name: ci

on:
  push:
    tags: ["v*"]
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.13
        cache: 'uv'

    - run: pipx install uv ruff

    - name: Install dependencies
      run: |
        uv sync

    - name: check code
      shell: bash
      run: ruff check . && uv run mypy -m tg_file_exporter

  compile:

    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
    needs: ["build"]
    strategy:
      max-parallel: 4
      matrix:
        os: ["ubuntu-latest", "windows-latest"]

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python x64
      uses: actions/setup-python@v6
      with:
        python-version: 3.10
        cache: 'uv'

    - run: pipx install uv
    - name: Install dependencies
      shell: bash
      run: |
        uv sync

    - name: building executable
      shell: bash
      run: uv build && uv run pyinstaller --noconsole -F tg-file-exporter.pyw


    - uses: actions/upload-artifact@v7
      with:
        name: exe_for_${{ matrix.os }}_${{ matrix.architecture }}
        path: dist/tg-file-exporter*

  uploadrelease:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
    needs: ["build", "compile"]
    steps:
    - uses: actions/checkout@v6
    - name: download releases files
      uses: actions/download-artifact@v8
    - name: Display structure of downloaded files
      run: ls -R

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: exe_for_*/msspeech*
        fail_on_unmatched_files: true
        # append_body: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.10
        cache: 'uv'

    - name: Install dependencies
      run: |
        uv sync

    - name: build
      run: |
        uv build

    - name: Publish to pypi
      run: |
        uv publish
      env:
        UV_PUBLISH_USERNAME: __token__
        UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_TOKEN }}
